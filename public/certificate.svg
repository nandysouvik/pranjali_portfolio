<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#ffc0cb" opacity="0.1" stroke="#ffc0cb" stroke-width="2"/>
  
  <!-- Decorative ribbons -->
  <path d="M 50 60 Q 100 50 150 60 L 145 75 Q 100 65 55 75 Z" fill="#ff69b4" opacity="0.6"/>
  <path d="M 50 140 Q 100 150 150 140 L 145 125 Q 100 135 55 125 Z" fill="#ff69b4" opacity="0.6"/>
  
  <!-- Star decorations -->
  <g fill="#ffc0cb" opacity="0.8">
    <path d="M 100 30 L 102 38 L 110 38 L 104 43 L 106 51 L 100 46 L 94 51 L 96 43 L 90 38 L 98 38 Z"/>
    <path d="M 30 100 L 38 102 L 38 110 L 43 104 L 51 106 L 46 100 L 51 94 L 43 96 L 38 90 L 38 98 Z"/>
    <path d="M 170 100 L 162 98 L 162 90 L 157 96 L 149 94 L 154 100 L 149 106 L 157 104 L 162 110 L 162 102 Z"/>
    <path d="M 100 170 L 98 162 L 90 162 L 96 157 L 94 149 L 100 154 L 106 149 L 104 157 L 110 162 L 102 162 Z"/>
  </g>
  
  <!-- Center decorative element - Dance symbol -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="#ffc0cb" stroke-width="2" opacity="0.5"/>
  
  <!-- Dance figure silhouette -->
  <g transform="translate(100, 100)">
    <!-- Body -->
    <ellipse cx="0" cy="5" rx="8" ry="15" fill="#ff69b4" opacity="0.7"/>
    <!-- Head -->
    <circle cx="0" cy="-15" r="8" fill="#ff69b4" opacity="0.7"/>
    <!-- Arms -->
    <path d="M -8 -5 Q -20 -15 -15 -25" stroke="#ff69b4" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M 8 -5 Q 20 -15 15 -25" stroke="#ff69b4" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- Legs -->
    <path d="M -5 20 Q -10 35 -5 40" stroke="#ff69b4" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M 5 20 Q 10 35 5 40" stroke="#ff69b4" stroke-width="3" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Sparkle effects -->
  <g fill="#ffc0cb" opacity="0.6">
    <circle cx="70" cy="70" r="2"/>
    <circle cx="130" cy="70" r="2"/>
    <circle cx="70" cy="130" r="2"/>
    <circle cx="130" cy="130" r="2"/>
  </g>
</svg>

